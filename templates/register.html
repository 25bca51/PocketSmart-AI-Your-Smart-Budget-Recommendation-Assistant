{% extends "base.html" %}

{% block title %}
Register - PocketSmart AI
{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <span class="badge">
            Get started
        </span>

        <h1>
            Create account
        </h1>

        <p>
            Start planning smarter with PocketSmart AI.
        </p>


        {% if error %}

        <div class="alert error">
            {{ error }}
        </div>

        {% endif %}


        <form
            method="POST"
            action="/register"
        >

            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="you@example.com"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Minimum 6 characters"
                minlength="6"
                required
            >


            <button
                type="submit"
                class="primary-button full-width"
            >
                Create Account
            </button>

        </form>


        <p class="auth-footer">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </p>

    </div>

</div>

{% endblock %}
